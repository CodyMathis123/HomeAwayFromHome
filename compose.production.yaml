# Canonical production overlay for the deployed private HTTPS domain.
# Always append after compose.yaml, compose.control.yaml, compose.accounts.yaml,
# and compose.computers.yaml. Replaces both historical Phase 3 overlays.
services:
  gateway:
    image: homeaway-caddy-dns01:2.11.7-cloudflare-v0.2.4
    build:
      context: ./control/gateway
      dockerfile: Dockerfile.dns01
    entrypoint: ["/usr/local/bin/start-dns01"]
    secrets:
      - cloudflare_dns01_token
    volumes:
      - ./control/gateway/Caddyfile.production:/etc/caddy/Caddyfile:ro

  pc-control:
    volumes:
      - ./data/control/backup-status:/backup-status:ro
    environment:
      HOMEAWAY_CONTROL_ORIGIN: "https://home.homeawayfromhome.house"
      # Legacy 8443 remains an explicitly allowlisted fallback during rollout.
      HOMEAWAY_CONTROL_ALT_ORIGIN: "https://home.homeawayfromhome.house:8443"

  metrics-diagnostics:
    environment:
      # Certificate observer connects to the fixed private gateway address;
      # these values control only TLS SNI and SAN verification.
      HOMEAWAY_DOMAIN: "home.homeawayfromhome.house"
      HOMEAWAY_AUTH_DOMAIN: "auth.homeawayfromhome.house"
      HOMEAWAY_METRICS_DOMAIN: "metrics.homeawayfromhome.house"

  portal:
    environment:
      HOMEAWAY_CONTROL_URL: "https://home.homeawayfromhome.house/control/"
      HOMEAWAY_METRICS_ORIGIN: "https://metrics.homeawayfromhome.house"

  grafana:
    environment:
      GF_SERVER_ROOT_URL: "https://metrics.homeawayfromhome.house"

secrets:
  cloudflare_dns01_token:
    file: ./secrets/control/cloudflare_dns01_token

name: Cooling package and Linux end-to-end

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [Production]
    paths:
      - '.github/workflows/cooling-linux-e2e.yml'
      - 'compose.cooling-only.yaml'
      - 'deploy/cooling/**'
      - 'deploy/components/**'
      - 'scripts/init-cooling-standalone.py'
      - 'scripts/cooling-stack.py'
      - 'scripts/components.py'
      - 'scripts/compose_generator.py'
      - 'scripts/tests/test_compose_generation.py'
      - 'scripts/tests/test_component_resolver.py'
      - 'scripts/build-cooling-release.py'
      - 'scripts/verify-cooling-package.py'
      - 'scripts/integration-cooling-linux.py'
      - 'scripts/tests/test_cooling_modularity.py'
      - 'ingest/**'
      - 'grafana/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            components: cooling-monitoring
            variant: cooling
          - os: ubuntu-24.04
            components: linux-host-monitoring
            variant: host
          - os: ubuntu-24.04
            components: cooling-monitoring,linux-host-monitoring
            variant: combined
          - os: ubuntu-24.04-arm
            components: cooling-monitoring
            variant: cooling
          - os: ubuntu-24.04-arm
            components: linux-host-monitoring
            variant: host
          - os: ubuntu-24.04-arm
            components: cooling-monitoring,linux-host-monitoring
            variant: combined
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile and build release payloads
        run: |
          python3 -m compileall -q scripts/init-cooling-standalone.py scripts/cooling-stack.py scripts/components.py scripts/compose_generator.py scripts/build-cooling-release.py scripts/verify-cooling-package.py scripts/integration-cooling-linux.py
          python3 -m unittest discover -s scripts/tests -p test_cooling_modularity.py -v
          python3 -m unittest discover -s scripts/tests -p test_component_resolver.py -v
          python3 -m unittest discover -s scripts/tests -p test_compose_generation.py -v
          python3 scripts/build-cooling-release.py --version 0.1.0
          python3 scripts/verify-cooling-package.py --version 0.1.0

      - name: Install built Debian package without starting services
        run: |
          sudo dpkg -i dist/homeaway-cooling_0.1.0_all.deb
          test ! -e /etc/homeaway-cooling/cooling.env
          test ! -e /var/lib/homeaway-cooling
          test -z "$(sudo docker ps -a -q --filter label=com.docker.compose.project=homeaway-cooling)"
          homeaway-cooling version
          sudo homeaway-cooling plan
          sudo homeaway-cooling components --json |
            python3 -c 'import sys,json; c=json.load(sys.stdin); assert any(x["id"]=="cooling-monitoring" and x["status"]=="prototype" for x in c)'
          sudo homeaway-cooling plan --components "${{ matrix.components }}" --json |
            python3 -c 'import sys,json; p=json.load(sys.stdin); assert p["deployable"] and p["automatically_added"]==["metrics-storage","observability-ui"]'
          sudo homeaway-cooling plan --components cooling-monitoring,dns-metrics --design --json |
            python3 -c 'import sys,json; p=json.load(sys.stdin); assert not p["deployable"] and p["services"].count("victoria-metrics")==1 and "dns-filtering" in p["automatically_added"]'
          if sudo homeaway-cooling plan --components dns-metrics >/dev/null 2>&1; then
            echo 'ERROR: planned features must not be installable'
            exit 1
          fi
          if sudo homeaway-cooling init --components vpn --bind-ip 127.0.0.1 >/dev/null 2>&1; then
            echo 'ERROR: planned features must not create credentials'
            exit 1
          fi
          test ! -e /etc/homeaway-cooling/cooling.env

      - name: Initialize brand-new test-only cooling credentials
        run: |
          printf 'INITIALIZE COOLING\n' |
            sudo script -q -e -c 'homeaway-cooling init --components ${{ matrix.components }} --bind-ip 127.0.0.1 --https-port 19443' /dev/null
          sudo test -f /etc/homeaway-cooling/cooling.env
          if [ "${{ matrix.variant }}" = "host" ]; then
            sudo test ! -e /var/lib/homeaway-cooling/secrets/telemetry
          else
            sudo test -f /var/lib/homeaway-cooling/secrets/telemetry/token
          fi
          sudo grep -Fxq 'COOLING_COMPONENTS=${{ matrix.components }}' /etc/homeaway-cooling/cooling.env
          sudo test -f /var/lib/homeaway-cooling/generated/compose.generated.json
          sudo docker compose --env-file /etc/homeaway-cooling/cooling.env --project-directory /opt/homeaway-cooling -f /var/lib/homeaway-cooling/generated/compose.generated.json config -q
          sudo homeaway-cooling plan
          sudo homeaway-cooling plan --json |
            python3 -c 'import sys,json; p=json.load(sys.stdin); assert p["initialized"] and p["selection_matches_installed"]'
          if sudo homeaway-cooling start --components dns-filtering >/dev/null 2>&1; then
            echo 'ERROR: selection mismatch must fail before Docker'
            exit 1
          fi

      - name: Validate generated Caddyfile before starting containers
        run: |
          sudo docker run --rm \
            --env-file /etc/homeaway-cooling/cooling.env \
            -v /var/lib/homeaway-cooling/generated/Caddyfile.generated:/etc/caddy/Caddyfile:ro \
            caddy:2.11.7-alpine caddy adapt --config /etc/caddy/Caddyfile >/dev/null
          echo 'PASS: generated HTTPS Caddyfile parses for selected components'

      - name: Boot released containers, verify actual HTTPS and ingestion
        run: |
          printf 'START MONITORING\n' |
            sudo script -q -e -c 'homeaway-cooling start' /dev/null
          sudo python3 scripts/integration-cooling-linux.py

      - name: Verify samples persist across container teardown/recreation
        run: |
          printf 'STOP MONITORING\n' |
            sudo script -q -e -c 'homeaway-cooling stop' /dev/null
          printf 'START MONITORING\n' |
            sudo script -q -e -c 'homeaway-cooling start' /dev/null
          sudo python3 scripts/integration-cooling-linux.py --check-existing

      - name: Upgrade Debian release without losing data or restarting containers
        run: |
          before="$(sudo docker ps -q --filter label=com.docker.compose.project=homeaway-cooling | sort)"
          test -n "$before"
          python3 scripts/build-cooling-release.py --version 0.1.1 --output dist/upgrade
          python3 scripts/verify-cooling-package.py --version 0.1.1 --dist dist/upgrade
          sudo dpkg -i dist/upgrade/homeaway-cooling_0.1.1_all.deb
          test "$(homeaway-cooling version)" = "0.1.1"
          after="$(sudo docker ps -q --filter label=com.docker.compose.project=homeaway-cooling | sort)"
          test "$before" = "$after"
          sudo test -s /etc/homeaway-cooling/cooling.env
          if [ "${{ matrix.variant }}" != "host" ]; then
            sudo test -s /var/lib/homeaway-cooling/secrets/telemetry/token
          fi
          sudo python3 scripts/integration-cooling-linux.py --check-existing
          echo 'PASS: package upgrade preserves running containers, credentials and metric history'

      - name: Verify Debian remove leaves installed state intact
        run: |
          printf 'STOP MONITORING\n' |
            sudo script -q -e -c 'homeaway-cooling stop' /dev/null
          sudo dpkg -r homeaway-cooling
          sudo test -s /etc/homeaway-cooling/cooling.env
          sudo test -s /var/lib/homeaway-cooling/secrets/grafana_admin_password
          test ! -e /opt/homeaway-cooling
          echo 'PASS: package removal did not wipe configuration or credentials'

      - name: Upload portable and Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homeaway-cooling-linux-0.1.0-${{ runner.arch }}-${{ matrix.variant }}
          path: |
            dist/homeaway-cooling_0.1.0_linux-portable.tar.gz
            dist/homeaway-cooling_0.1.0_all.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Show scoped diagnostic logs on failure
        if: failure()
        run: |
          sudo docker ps -a --filter label=com.docker.compose.project=homeaway-cooling             --format 'table {{.Names}}\t{{.Status}}'
          # Do not dump container environment or secret-bearing request headers.
          sudo docker logs --tail=50 homeaway-cooling-gateway-1 2>&1 || true
          sudo docker logs --tail=50 homeaway-cooling-grafana-1 2>&1 || true
          sudo docker logs --tail=50 homeaway-cooling-telemetry-ingest-1 2>&1 || true
          sudo docker logs --tail=50 homeaway-cooling-node-exporter-1 2>&1 || true

      - name: Teardown disposable CI-only project
        if: always()
        run: |
          if sudo test -f /etc/homeaway-cooling/cooling.env && sudo test -f /var/lib/homeaway-cooling/generated/compose.generated.json; then
            sudo docker compose --env-file /etc/homeaway-cooling/cooling.env --project-directory /opt/homeaway-cooling -f /var/lib/homeaway-cooling/generated/compose.generated.json down -v --remove-orphans || true
          fi
          # GitHub hosted runner is ephemeral. These paths are CI-generated only.
          sudo rm -rf -- /etc/homeaway-cooling /var/lib/homeaway-cooling

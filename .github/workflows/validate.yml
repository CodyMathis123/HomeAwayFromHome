name: Validate Pi infrastructure
on:
  # PR creation tests the merge ref once. Later PR synchronize events are
  # intentionally omitted: GitHub computes PR path filters from the entire
  # PR diff, so a docs-only follow-up would rerun expensive CI.
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [Production, feature/pi4-home-infrastructure, feature/homeaway-grafana-embed, feature/homeaway-auth-pc-control]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Every code-bearing push to an integration branch is still validated.
  # GitHub push filters compare the newly pushed commit(s), not the full PR.
  # Markdown-only edits therefore do NOT start the full Docker test suite.
  push:
    branches: [Production, 'feature/**', 'fix/**', 'chore/**', 'integration/**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Python code and unit tests
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
          python3 -m compileall -q portal ingest monitoring control/accounts control/pcinventory control/pcctl scripts/tests
          node --check portal/app.js
          node --check portal/navigation.js
          node --check portal/router.js
          node scripts/tests/test_portal_router.cjs
          node --check portal/architecture.js
          node scripts/tests/test_architecture_status.cjs
          node --check control/api/app.js
          node scripts/tests/test_control_views.cjs
          node --check control/api/readiness.js
          node scripts/tests/test_readiness_view.cjs
          node --check control/api/accounts.js
          node --check control/api/computers.js
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_doc_links.py
      - name: Validate Bash script syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate Compose without starting privileged containers
        run: |
          cp .env.example .env
          mkdir -p secrets
          printf '%s\n' 'non-production-test-password' > secrets/pihole_password
          printf '%s\n' 'ci-only-dummy-password' > secrets/grafana_admin_password
          printf '%s\n' 'ci-pihole-app-password' > secrets/pihole_monitor_password
          printf '%s\n' 'ci-wg-metrics-bearer' > secrets/wg_metrics_bearer
          mkdir -p secrets/telemetry
          docker compose config -q
          docker compose --profile metrics config -q
          HOMEAWAY_DOMAIN=homeaway.home.arpa HOMEAWAY_AUTH_DOMAIN=auth.homeaway.home.arpa HOMEAWAY_METRICS_DOMAIN=metrics.homeaway.home.arpa PCCTL_GID=999 docker compose -f compose.yaml -f compose.control.yaml --profile control --profile metrics config -q
      - name: Validate feature-gated account directory overlay (no services started)
        run: |
          mkdir -p secrets/control
          for name in lldap_admin_password lldap_jwt_secret lldap_key_seed account_broker_token; do
            printf '%s\n' "synthetic-ci-only-secret-value-for-$name" > "secrets/control/$name"
          done
          HOMEAWAY_DOMAIN=homeaway.home.arpa HOMEAWAY_AUTH_DOMAIN=auth.homeaway.home.arpa HOMEAWAY_METRICS_DOMAIN=metrics.homeaway.home.arpa PCCTL_GID=999 \
            docker compose -f compose.yaml -f compose.control.yaml -f compose.accounts.yaml --profile control --profile accounts --profile metrics config -q
          python3 scripts/check_accounts_contracts.py
          python3 scripts/check_computers_contracts.py
      - name: Build application and wg-easy images without starting VPN
        run: |
          docker compose build portal wg-easy
          docker compose --profile metrics build telemetry-ingest pihole-exporter
          HOMEAWAY_DOMAIN=homeaway.home.arpa HOMEAWAY_AUTH_DOMAIN=auth.homeaway.home.arpa HOMEAWAY_METRICS_DOMAIN=metrics.homeaway.home.arpa PCCTL_GID=999 \
            docker compose -f compose.yaml -f compose.control.yaml --profile control --profile metrics build metrics-diagnostics
          # Verify that the official pinned multi-arch image is available.
          docker compose --profile metrics run --rm --no-deps pi-node-exporter --version
          docker compose run --rm --no-deps --entrypoint sh wg-easy -c \
            'iptables --version | grep -q nf_tables && ip6tables --version | grep -q nf_tables'
      - name: Enforce security and deployment contracts
        run: python3 scripts/check_contracts.py
      - name: Validate resolved PC control network and container isolation
        run: python3 scripts/check_control_contracts.py
      - name: Verify optional Caddy and Authelia gateway configuration
        run: python3 scripts/integration-control-gateway.py
      - name: Verify real VictoriaMetrics ingestion and cooling join
        run: |
          docker run --rm -d --name homeaway-vm-ci -p 127.0.0.1:18428:8428 \
            -v "$PWD/monitoring/scrape.yml:/etc/victoria-metrics/prometheus.yml:ro" \
            -v "$PWD/secrets/wg_metrics_bearer:/run/secrets/wg_metrics_bearer:ro" \
            victoriametrics/victoria-metrics:v1.155.0 \
            -retentionPeriod=1d -search.latencyOffset=0s -promscrape.config=/etc/victoria-metrics/prometheus.yml
          trap 'docker rm -f homeaway-vm-ci >/dev/null 2>&1 || true' EXIT
          python3 scripts/integration-victoriametrics.py
          python3 scripts/integration-diagnostics.py
      - name: Verify Grafana bootstrap and provisioned dashboard import
        run: |
          docker run --rm -d --name homeaway-grafana-ci \
            -p 127.0.0.1:13000:3000 \
            -e GF_SECURITY_ADMIN_PASSWORD=ci-only-grafana-password \
            -e GF_AUTH_ANONYMOUS_ENABLED=false \
            -v "$PWD/grafana/provisioning:/etc/grafana/provisioning:ro" \
            -v "$PWD/grafana/dashboards:/etc/grafana/dashboards:ro" \
            grafana/grafana:13.3.0
          trap 'docker rm -f homeaway-grafana-ci >/dev/null 2>&1 || true' EXIT
          python3 scripts/integration-grafana.py

  dns01-staging:
    # Build/test isolated ACME staging without a token or live DNS changes.
    if: github.head_ref == 'feature/phase3-dns01-staging-prep' || github.head_ref == 'fix/dns01-caddy-noexec' || github.ref == 'refs/heads/feature/phase3-dns01-staging-prep' || github.ref == 'refs/heads/fix/dns01-caddy-noexec'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build exact pinned Caddy DNS module
        run: |
          docker build -f control/gateway/Dockerfile.dns01 -t homeaway-caddy-dns01:ci ./control/gateway
          # Reproduce the Pi's hardened Compose restrictions, including the
          # no-new-privileges + dropped capabilities combination that failed.
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --entrypoint /usr/local/bin/homeaway-caddy \
            homeaway-caddy-dns01:ci list-modules | grep -Fx dns.providers.cloudflare
      - name: Adapt staging-only Caddyfile offline under hardened restrictions
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --entrypoint /usr/local/bin/homeaway-caddy \
            -e CF_API_TOKEN=ci-synthetic-placeholder \
            -v "$PWD/control/gateway/Caddyfile.dns01-staging:/etc/caddy/Caddyfile:ro" \
            homeaway-caddy-dns01:ci adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
      - name: Smoke-test real staging entrypoint with synthetic, offline configuration
        run: |
          mkdir -p secrets/control
          printf 'ci-synthetic-not-a-token\n' > secrets/control/cloudflare_dns01_token
          # Network disabled: even an accidental ACME request cannot reach a
          # real DNS provider. The smoke config does not request certificates.
          printf '{\n  auto_https off\n}\n:8443 {\n  respond "staging smoke test"\n}\n' > /tmp/homeaway-staging-smoke.Caddyfile
          cid=$(docker run -d --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --network none --tmpfs /tmp --tmpfs /data --tmpfs /config \
            -v "$PWD/secrets/control/cloudflare_dns01_token:/run/secrets/cloudflare_dns01_token:ro" \
            -v "/tmp/homeaway-staging-smoke.Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint /usr/local/bin/start-dns01 homeaway-caddy-dns01:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sleep 3
          docker ps --filter "id=$cid" --filter status=running --quiet | grep -q .
          docker logs "$cid" 2>&1 | grep -q 'serving initial configuration'

      - name: Validate isolated Compose project (synthetic token only)
        run: |
          mkdir -p secrets/control
          printf 'ci-synthetic-not-a-token\n' > secrets/control/cloudflare_dns01_token
          docker compose -p homeaway-dns01-staging -f compose.dns01-staging.yaml config -q
          docker compose -p homeaway-dns01-staging -f compose.dns01-staging.yaml config --format json | \
            python3 scripts/check_dns01_resolved.py

  dns01-production:
    # Offline CI only; no ACME issuance, production DNS writes or live Pi.
    if: github.head_ref == 'feature/phase3-production-dns01-certificates' || github.ref == 'refs/heads/feature/phase3-production-dns01-certificates'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build Caddy pinned Cloudflare module under restricted execution
        run: |
          docker build -f control/gateway/Dockerfile.dns01 -t homeaway-caddy-dns01:ci ./control/gateway
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --entrypoint /usr/local/bin/homeaway-caddy \
            homeaway-caddy-dns01:ci list-modules | grep -Fx dns.providers.cloudflare
      - name: Adapt live legacy and new certificate-only routes offline
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --entrypoint /usr/local/bin/homeaway-caddy \
            -e CF_API_TOKEN=ci-synthetic-only \
            -e HOMEAWAY_DOMAIN=homeaway.home.arpa \
            -e HOMEAWAY_AUTH_DOMAIN=auth.homeaway.home.arpa \
            -e HOMEAWAY_METRICS_DOMAIN=metrics.homeaway.home.arpa \
            -v "$PWD/control/gateway/Caddyfile.dns01-production:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/control/gateway/Caddyfile:/etc/caddy/Caddyfile.legacy:ro" \
            homeaway-caddy-dns01:ci adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /tmp/homeaway-caddy-dns01.json
          python3 scripts/check_dns01_caddy_routes.py /tmp/homeaway-caddy-dns01.json
      - name: Verify resolved Compose only changes the gateway
        run: |
          cp .env.example .env
          mkdir -p secrets/control
          printf 'ci-synthetic-only\n' > secrets/control/cloudflare_dns01_token
          for name in pihole_password grafana_admin_password pihole_monitor_password wg_metrics_bearer; do
            printf 'ci-synthetic-only\n' > "secrets/$name"
          done
          for name in lldap_admin_password lldap_jwt_secret lldap_key_seed account_broker_token; do
            printf 'ci-synthetic-only\n' > "secrets/control/$name"
          done
          export HOMEAWAY_DOMAIN=homeaway.home.arpa HOMEAWAY_AUTH_DOMAIN=auth.homeaway.home.arpa HOMEAWAY_METRICS_DOMAIN=metrics.homeaway.home.arpa PCCTL_GID=999 PCINV_GID=999
          files=(-f compose.yaml -f compose.control.yaml -f compose.accounts.yaml -f compose.computers.yaml)
          docker compose "${files[@]}" --profile control --profile accounts --profile metrics config --format json > /tmp/homeaway-base.json
          docker compose "${files[@]}" -f compose.dns01-production.yaml --profile control --profile accounts --profile metrics config --format json > /tmp/homeaway-prod.json
          python3 scripts/check_dns01_production_resolved.py /tmp/homeaway-base.json /tmp/homeaway-prod.json

  identity-lab:
    # Disposable fake users only; never mount the Pi's live Authelia files,
    # never publish a directory service on a non-loopback interface.
    if: (github.event_name == 'pull_request' && github.head_ref == 'feature/homeaway-account-management') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/homeaway-account-management')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe LLDAP account/role mutations with synthetic identities
        env:
          HOMEAWAY_LLDAP_LAB: "1"
        run: python3 scripts/integration-identity-lab.py

  authelia-ldap-session-lab:
    # Disposable isolated identity store only. Tests two independent real
    # password + TOTP sessions with role revocation; never mounts live data.
    if: (github.event_name == 'pull_request' && github.head_ref == 'feature/homeaway-account-management') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/homeaway-account-management')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test Authelia LLDAP role revocation with existing TOTP sessions
        env:
          HOMEAWAY_LLDAP_LAB: "1"
        run: python3 scripts/integration-authelia-lldap.py

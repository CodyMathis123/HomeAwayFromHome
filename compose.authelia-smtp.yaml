# Optional Authelia SMTP notifier. Requires operator to remove the old
# notifier.filesystem section from /config/configuration.yml before starting.
# Never enables public ports or changes the existing identity databases.
services:
  authelia:
    environment:
      AUTHELIA_NOTIFIER_SMTP_ADDRESS: "submissions://smtp.resend.com:465"
      AUTHELIA_NOTIFIER_SMTP_USERNAME: "resend"
      AUTHELIA_NOTIFIER_SMTP_SENDER: "HomeAway <accounts@homeawayfromhome.house>"
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /run/secrets/authelia_smtp_password
      AUTHELIA_NOTIFIER_DISABLE_STARTUP_CHECK: "false"
    secrets:
      - authelia_smtp_password

secrets:
  authelia_smtp_password:
    file: ./secrets/control/authelia_smtp_password
